name: 🚀 Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build + Deploy a Fly.io
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js 20
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias del servidor
      - name: 📦 Instalar dependencias (servidor)
        run: npm ci --omit=dev

      # 4. Instalar dependencias del cliente
      - name: 📦 Instalar dependencias (cliente)
        run: cd client && npm ci

      # 5. Build del cliente (Vite)
      - name: 🏗️ Build cliente
        run: npm run build

      # 6. Deploy a Fly.io
      - name: 🚀 Deploy a Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
