app = "franyelis-dashboard"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"
  DB_PATH = "/data/clinica.db"
  AUTH_PATH = "/data/whatsapp-auth"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "klin_data"
  destination = "/data"
